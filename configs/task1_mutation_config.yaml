# Task 1: Mutation Report Generation Configuration
# Processes mutation data from MSK and GENIE datasets

# ============================================================================
# Input Data Directories
# ============================================================================
msk_ch_2020_dir: "/data1/morrisq/yuj13/llm_genomics/msk_ch_2020"
msk_ch_2023_dir: "/data1/morrisq/yuj13/llm_genomics/msk_ch_2023"
genie_dir: "/data1/morrisq/yuj13/llm_genomics/genie_data_v17.0"

# ============================================================================
# Intermediate Output Directories
# ============================================================================
# These are generated by filtering steps
msk_new_only_dir: "/data1/morrisq/yuj13/llm_genomics/msk_ch_2023_new_only"
genie_msk_new_only_dir: "/data1/morrisq/yuj13/llm_genomics/genie_data_v17.0_msk_new_only"

# ============================================================================
# Output Configuration
# ============================================================================
# Base output directory for mutation reports
output_base_dir: "/data1/morrisq/yuj13/llm_genomics/mutation_report"

# Report variants to generate
# Set to true/false to enable/disable specific variants
generate_variants:
  with_vaf_aggregate: true       # mutation_status_final_aggregate/
  with_vaf_noaggregate: true     # mutation_status_final/
  no_vaf_aggregate: true         # mutation_status_final_noVAF_aggregate/
  no_vaf_noaggregate: true       # mutation_status_final_noVAF/

# ============================================================================
# Processing Options
# ============================================================================
# Skip filtering steps if intermediate files already exist
skip_filtering: false

# Chunk size for output CSV files (number of samples per file)
chunk_size: 7500

# Mutation status labels
mutation_status:
  genie: "TUMOR-SOMATIC"  # Label for GENIE data
  msk_ch: "CHIP"           # Label for MSK CH data

# ============================================================================
# Data Processing Options
# ============================================================================
# Normalization settings for sample IDs
normalize_sample_ids:
  enabled: true
  pattern: "-IM\\d*$"  # Regex pattern to remove (e.g., -IM7)

# GENIE patient ID conversion
patient_id_conversion:
  genie_prefix: "GENIE-MSK-"

# ============================================================================
# File Naming Conventions
# ============================================================================
# Input file names (relative to data directories)
input_files:
  clinical_sample: "data_clinical_sample.txt"
  mutations: "data_mutations.txt"
  mutations_extended: "data_mutations_extended.txt"

# Output file naming
output_files:
  # For GENIE data
  genie_prefix: "genie_batch"
  # For MSK CH data
  msk_ch_prefix: "msk_CH_batch"

# ============================================================================
# Filtering Criteria
# ============================================================================
# Columns required for processing
required_columns:
  - "Hugo_Symbol"
  - "Variant_Classification"
  - "Reference_Allele"
  - "Tumor_Seq_Allele2"
  - "t_VAF"

# Features to include in reports
report_features:
  - "CANCER_TYPE"
  - "CANCER_TYPE_DETAILED"

# ============================================================================
# Logging
# ============================================================================
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "[%(asctime)s] %(levelname)s: %(message)s"
