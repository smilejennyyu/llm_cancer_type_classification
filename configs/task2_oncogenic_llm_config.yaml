# Task 2: LLM-based Oncogenic Classification Configuration
# Classifies mutations as Oncogenic vs Benign

# ============================================================================
# LLM Provider Configuration
# ============================================================================
llm_provider: "azure"  # Options: "azure", "openai", "claude", "medgemma", "local"

# Azure OpenAI settings
azure:
  api_key_env: "AZURE_OPENAI_API_KEY"
  endpoint_env: "AZURE_OPENAI_ENDPOINT"
  api_version: "2025-01-01-preview"
  model_name: "gpt-4o"

# OpenAI settings
openai:
  api_key_env: "OPENAI_API_KEY"
  model_name: "gpt-4"

# Claude settings
claude:
  base_url: "http://tllihpcgpu1:4000/v1"
  api_key: "litellm"
  model_name: "bedrock-sonnet-37"

# Local model settings (HuggingFace models)
local:
  model_name: "google/medgemma-27b-it"
  device: "cuda"
  quantization: true

  # Generation parameters
  max_new_tokens: 150   # Short JSON outputs need fewer tokens; use 64 with use_json_prefill
  temperature: 0.7
  top_p: 0.9

  # Greedy decoding: faster and more deterministic for short JSON classification outputs
  greedy_decoding: false  # set true for medgemma/qwen (do_sample=False, temperature ignored)

  # Compress long mutation reports to first+last 5 lines before sending to the model
  compress_input: false  # set true to speed up inference on long reports

  # Hard cap on input token count (prevents OOM on very long reports)
  max_input_tokens: null  # e.g. 512

  # Clear CUDA cache every N samples to prevent memory fragmentation
  clear_cuda_cache_every: 100

  # HuggingFace model cache directory (avoids downloading to home directory)
  hf_home: null  # e.g. "/data1/morrisq/yuj13/llm_genomics/huggingface_model"

  # PyTorch CUDA memory allocator (recommended for long runs)
  pytorch_cuda_alloc_conf: "expandable_segments:True"

  # DeepSeek-R1 specific JSON pre-fill
  use_json_prefill: false

# ============================================================================
# Input/Output Configuration
# ============================================================================
# Input directory containing oncogenic mutation reports
input_dir: "/data1/morrisq/yuj13/llm_genomics/mutation_report/impact_oncogenic_sample_new"

# Output directory for predictions
output_dir: "/data1/morrisq/yuj13/llm_genomics/mutation_output/impact_oncogenic_sample"

# Prompt template file
prompt_template: "prompts/prompt_mutation_prediction_oncogenic_absolute.txt"
# Alternatively: "prompts/prompt_mutation_prediction_oncogenic_absolute_no_explain.txt"

# ============================================================================
# Processing Options
# ============================================================================
# Include explanation in output
include_explanation: false  # Faster without explanation

# Batch processing
batch_size: null

# Resume from existing output
resume: true

# Task 2 is per-mutation: resume on mutation_id, not SAMPLE_ID
# (multiple mutations share the same SAMPLE_ID)
resume_on: mutation_id

# Limit sample count for testing (0 = process all; also reads TEST_N_SAMPLES env var)
test_n_samples: 0

# ============================================================================
# API Call Configuration
# ============================================================================
# Retry settings
retry:
  max_retries: 20
  initial_wait_time: 2
  max_wait_time: 60
  max_reprompt_attempts: 3

# Rate limiting
rate_limit:
  requests_per_minute: 60
  delay_between_calls: 1

# ============================================================================
# Data Processing
# ============================================================================
# Required columns in input CSV
required_columns:
  - "SAMPLE_ID"
  - "mutation_id"        # Per-mutation identifier (needed for correct resumption)
  - "ONCOGENIC"          # Ground truth
  - "report_str"         # Mutation report text

# Output columns
output_columns:
  - "prediction"
  - "prob"

# Column name mapping
column_mapping:
  ONCOGENIC: "ground_truth"

# ============================================================================
# Logging
# ============================================================================
logging:
  level: "INFO"
  file: "oncogenic_prediction.log"
  format: "%(asctime)s - %(levelname)s - %(message)s"

# ============================================================================
# Validation
# ============================================================================
# Valid prediction values — kept narrow to match what the prompt asks for
valid_predictions:
  - "Oncogenic"
  - "Benign"

# Normalize model output variations to canonical labels before validation
normalize_predictions:
  "Likely Oncogenic": "Oncogenic"
  "Likely Neutral":   "Benign"
  "Likely Benign":    "Benign"
  "Pathogenic":       "Oncogenic"
  "VUS":              "Benign"
